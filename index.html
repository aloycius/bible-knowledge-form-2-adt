    for (const el of root.querySelectorAll('[data-source-line]')) {

      if (!target || !el.textContent.trim()) continue;
      const rotation = Number(el.dataset.sourceRotation) || 0;
      const rotate = rotation ? 'rotate(' + rotation + 'deg) ' : '';
      el.style.transform = 'none';
      const words = el.querySelectorAll('[style*="--adt-source-word-width"]');
      if (words.length) {
        el.style.width = target + 'px';
        for (const word of words) {
          word.style.transform = 'none';
          const range = document.createRange(); range.selectNodeContents(word);
          const natural = range.getBoundingClientRect().width / scale;
          const width = Number(word.style.getPropertyValue('--adt-source-word-width'));
          if (natural > 0 && width > 0) word.style.transform = 'scaleX(' + width / natural + ')';
        }
        el.style.transform = rotate || 'none';
        continue;
      }
      const range = document.createRange(); range.selectNodeContents(el);
      const natural = range.getBoundingClientRect().width / scale;
      if (natural > 0) {
        el.style.width = natural + 'px';
        el.style.transform = rotate + 'scaleX(' + target / natural + ')';
      }
    }
  }
  document.fonts.ready.then(fitSourceLines);
  new MutationObserver(fitSourceLines).observe(root, {childList:true, subtree:true});

        var W = parseFloat(c.style.width) || c.offsetWidth || 1;
        var H = parseFloat(c.style.height) || c.offsetHeight || 1;
        var ref = parseFloat(c.getAttribute("data-fl-reference-width"));
        var refW = ref > 0 ? ref : W;
        var FALLBACK = 96;
        function dock() {
          var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dock-height"));
          return v > 0 ? v : FALLBACK;
        }
        function fit() {
          var DOCK = dock();
          var byW = window.innerWidth / refW;
          var byH = (window.innerHeight - DOCK) / H;
          var s = Math.min(2, byW, byH > 0 ? byH : byW);
          c.style.position = "absolute";
          c.style.left = (window.innerWidth / 2) + "px";
          c.style.top = ((window.innerHeight - DOCK) / 2) + "px";
          c.style.margin = "0";
          c.style.transformOrigin = "center center";
          c.style.transform = "translate(-50%, -50%) scale(" + s + ")";
          c.style.visibility = "visible";
